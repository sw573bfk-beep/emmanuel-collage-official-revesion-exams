<!DOCTYPE html>
<html lang="en" data-build="1795320852">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Study Base</title>
<style>
:root{--bg:#0d141c;--panel:#152030;--panel2:#1c2a3c;--line:#2a3b50;--ink:#e9eff6;--muted:#9eb0c4;--gold:#f6c744;--food:#9ad66f;--war:#ef4444;--peace:#38bdf8;--btn:#2f6fe4;--good:#22c55e}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 16px;background:#09101a;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header a.back{color:var(--muted);text-decoration:none;font-weight:700}
header a.back:hover{color:var(--ink)}
header h1{font-size:1.15rem;margin:0}
.tag{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;background:#2b2106;color:var(--gold);border:1px solid #5d4711}
.hud{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{color:var(--muted);font-weight:600}
.pill.war{border-color:var(--war);color:#fecaca}.pill.peace{border-color:var(--peace);color:#bae6fd}
.btn{appearance:none;border:0;border-radius:10px;background:var(--btn);color:#fff;font:inherit;font-weight:800;padding:9px 14px;cursor:pointer;min-height:40px}
.btn:hover{filter:brightness(1.12)}.btn:focus-visible{outline:3px solid #fde047;outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.q{background:var(--panel2);border:1px solid var(--line);color:var(--ink)}.btn.war{background:var(--war)}.btn.peace{background:#0284c7}.btn.good{background:var(--good);color:#052e14}.btn.gold{background:var(--gold);color:#2b2106}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.875rem}
.btn.on{outline:3px solid #fde047;outline-offset:1px}
main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;padding:16px;max-width:1520px;margin:0 auto}
@media (max-width:1000px){main{grid-template-columns:1fr;padding:10px}}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;justify-content:center;align-items:flex-start}
canvas#cv{display:block;touch-action:none;border-radius:8px;max-width:100%;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;align-self:start}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{flex:1 1 auto;appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;padding:8px 6px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--panel2);color:var(--ink)}
.tabs button .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--war);color:#fff;font-size:.75rem;margin-left:3px}
.pane{padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:calc(100vh - 150px)}
@media (max-width:1000px){.pane{max-height:none}}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card.war{border-color:var(--war)}.card.peace{border-color:var(--peace)}.card.alert{border-color:var(--gold);background:#2a2208}
.card h3{margin:0;font-size:1rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:.85rem}
.item{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center}
.item .ic{width:46px;height:46px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;font-size:.875rem}
.stats b{font-variant-numeric:tabular-nums}
.bar{height:7px;background:#0a111a;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.overlay{position:absolute;inset:10px;display:flex;align-items:center;justify-content:center;background:rgba(4,9,15,.6);border-radius:8px}
.overlay .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 28px;text-align:center;display:flex;flex-direction:column;gap:10px;min-width:270px;max-width:90%}
.stars{font-size:2.4rem;letter-spacing:.12em;line-height:1}.stars .off{color:#3b4a5e}.stars .on{color:var(--gold)}
.big{font-size:1.4rem;font-weight:800}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#09101a;border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:20;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.loading{padding:40px;text-align:center;color:var(--muted)}
</style>

<body>
<header>
  <a class="back" href="/admin/">← Admin</a>
  <h1>🏰 Study Base</h1><span class="tag">Admin test</span>
  <div class="hud" id="hud"></div>
</header>
<main>
  <div class="stage" id="stage"><canvas id="cv" width="600" height="600" aria-label="Your base"></canvas><div id="over" class="overlay" hidden></div></div>
  <aside class="panel"><div class="tabs" role="tablist" id="tabs"></div><div class="pane" id="pane"><p class="loading">Loading your base…</p></div></aside>
</main>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<script>
// 🏰 Study Base (admin test version): the rules and the battle simulation.
// Shared by the server (it runs every battle and decides the result) and the game page (it draws the same battle).
// Everything here is deterministic: the same base and the same troop drops always give the same battle.
// scripts/build-base.sh copies this file into the page with the `export` words taken off.

const N = 22;            // the map is N × N tiles
const MAX_TH = 5;        // highest Town Hall level
const WAR_LOCK = 86400;  // war mode can't be turned off for 24 hours
const FIRST_RAID = 3 * 3600, RAID_EVERY = 4 * 3600; // bots raid you in war mode
const GOLD_PER_POINT = 3; // gold for each leaderboard answer point

// w × h in tiles; max = how many you can have at Town Hall level 1..5
const BLD = {
  hall:     { name: 'Town Hall',    w: 3, h: 3, hp: 1500, cost: 0,   max: [1, 1, 1, 1, 1], about: 'The heart of your base. Its level sets how far everything else can be upgraded, and how much it can store.' },
  house:    { name: 'House',        w: 2, h: 2, hp: 300,  cost: 100, max: [2, 3, 4, 5, 6], about: 'Pays taxes: more gold for every minute you study.' },
  farm:     { name: 'Farm',         w: 2, h: 2, hp: 300,  cost: 100, max: [2, 3, 4, 5, 6], about: 'Grows food for every minute you study. Food trains troops.' },
  store:    { name: 'Storehouse',   w: 2, h: 2, hp: 500,  cost: 200, max: [1, 1, 2, 2, 3], about: 'Lets you keep more gold and food.' },
  barracks: { name: 'Barracks',     w: 3, h: 3, hp: 600,  cost: 250, max: [1, 1, 1, 2, 2], about: 'Room for a bigger army.' },
  cannon:   { name: 'Cannon',       w: 2, h: 2, hp: 500,  cost: 250, max: [1, 2, 2, 3, 4], def: { range: 5.5, dmg: 22, rate: 1.0 }, about: 'Heavy shots at the closest attacker.' },
  tower:    { name: 'Archer Tower', w: 2, h: 2, hp: 400,  cost: 300, max: [0, 1, 2, 2, 3], def: { range: 7, dmg: 12, rate: 0.7 }, about: 'Long range, quick arrows.' },
  wall:     { name: 'Wall',         w: 1, h: 1, hp: 250,  cost: 20,  max: [10, 20, 30, 40, 50], about: 'Attackers have to break through walls before they can get past.' }
};
const BUILD_ORDER = ['house', 'farm', 'store', 'barracks', 'cannon', 'tower', 'wall'];
const TH_COST = [0, 500, 1200, 2500, 5000]; // gold to take the Town Hall from level L to L + 1 is TH_COST[L]

// dmg per hit, rate = seconds between hits, range/speed in tiles, food to train, space in the army
const TROOP = {
  warrior: { name: 'Warrior', hp: 110, dmg: 14, rate: 1.0, range: 0.8, speed: 1.4, food: 25,  space: 1, about: 'Tough all-rounder. Attacks whatever is closest.' },
  archer:  { name: 'Archer',  hp: 50,  dmg: 10, rate: 1.0, range: 3.5, speed: 1.5, food: 30,  space: 1, about: 'Shoots from range, even over walls. Fragile.' },
  brute:   { name: 'Brute',   hp: 520, dmg: 30, rate: 1.4, range: 0.9, speed: 0.9, food: 120, space: 5, prefers: 'def', about: 'Huge and slow. Goes for cannons and towers first.' }
};

function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const hallOf = blds => blds.find(b => b.type === 'hall');
const hallLvl = blds => (hallOf(blds) || { lvl: 1 }).lvl;
const hpOf = b => Math.round(BLD[b.type].hp * (1 + 0.5 * (b.lvl - 1)));
const dmgOf = (type, lvl) => BLD[type].def ? BLD[type].def.dmg * (1 + 0.35 * (lvl - 1)) : 0;
const maxCount = (type, th) => BLD[type].max[Math.min(th, MAX_TH) - 1];
const upgradeCost = b => b.type === 'hall' ? TH_COST[b.lvl] : BLD[b.type].cost * (b.lvl + 1);
const maxLevel = (b, th) => b.type === 'hall' ? MAX_TH : b.type === 'wall' ? th : th;
function rates(blds) { let gold = 2, food = 2; for (const b of blds) { if (b.type === 'house') gold += 2 * b.lvl; if (b.type === 'farm') food += 2 * b.lvl; } return { gold, food }; }
function caps(blds) { let c = 600 * hallLvl(blds); for (const b of blds) if (b.type === 'store') c += 500 * b.lvl; return { gold: c, food: c }; }
function armyCap(blds) { let c = 15; for (const b of blds) if (b.type === 'barracks') c += 10 * b.lvl; return c; }
const armySize = army => Object.keys(TROOP).reduce((s, k) => s + (army[k] || 0) * TROOP[k].space, 0);

function fits(blds, type, x, y, ignoreId) {
  const { w, h } = BLD[type];
  if (!Number.isInteger(x) || !Number.isInteger(y) || x < 0 || y < 0 || x + w > N || y + h > N) return false;
  return !blds.some(b => b.id !== ignoreId && x < b.x + BLD[b.type].w && b.x < x + w && y < b.y + BLD[b.type].h && b.y < y + h);
}
function freeSpot(blds, type) { // the free spot closest to the middle
  const { w, h } = BLD[type], c = N / 2; let best = null, bd = 1e9;
  for (let y = 0; y + h <= N; y++) for (let x = 0; x + w <= N; x++) if (fits(blds, type, x, y)) { const d = (x + w / 2 - c) ** 2 + (y + h / 2 - c) ** 2; if (d < bd) { bd = d; best = { x, y }; } }
  return best;
}
const rd = (px, py, x, y, w, h) => Math.hypot(Math.max(x - px, 0, px - (x + w)), Math.max(y - py, 0, py - (y + h)));
// troops can only be dropped away from buildings (more than 1.5 tiles from any of them), inside the map
const canDeploy = (blds, x, y) => x >= 0.3 && y >= 0.3 && x <= N - 0.3 && y <= N - 0.3 && blds.every(b => rd(x, y, b.x, b.y, BLD[b.type].w, BLD[b.type].h) > 1.5);

// a brand-new base: everyone starts with the same small village and nothing in store (resources come from studying)
function newBase() {
  return { v: 1, gold: 0, food: 0, seenSec: 0, seenPts: 0, nextId: 6,
    blds: [{ id: 1, type: 'hall', x: 9, y: 9, lvl: 1 }, { id: 2, type: 'house', x: 5, y: 7, lvl: 1 }, { id: 3, type: 'farm', x: 15, y: 7, lvl: 1 }, { id: 4, type: 'barracks', x: 5, y: 13, lvl: 1 }, { id: 5, type: 'cannon', x: 14, y: 14, lvl: 1 }],
    army: { warrior: 0, archer: 0, brute: 0 }, war: { on: false, lockUntil: 0 }, raidAt: 0, bots: [], reports: [], wins: 0, stars: 0 };
}

// a bot village for difficulty 1–10 (the same seed always makes the same village)
function botBase(seed, diff) {
  const r = rng(seed), th = Math.min(MAX_TH, Math.max(1, Math.ceil(diff / 2)));
  const lv = () => Math.max(1, th - (r() < 0.45 ? 1 : 0));
  const blds = []; let id = 1;
  const add = (type, x, y, lvl) => { if (!fits(blds, type, x, y)) return false; blds.push({ id: id++, type, x, y, lvl }); return true; };
  add('hall', 9, 9, th);
  const walled = diff >= 3, core = 4 + Math.floor(diff / 3), lo = 11 - core, hi = 10 + core;
  if (walled) for (let i = lo; i <= hi; i++) for (const [x, y] of [[i, lo], [i, hi], [lo, i], [hi, i]]) add('wall', x, y, lv());
  const a = walled ? lo + 1 : lo - 1, b = walled ? hi - 1 : hi + 1;
  const place = (type, n, inside = true) => {
    for (let k = 0; k < n; k++) for (let tries = 0; tries < 80; tries++) {
      const w = BLD[type].w, x = inside ? a + Math.floor(r() * (b - a - w + 2)) : 1 + Math.floor(r() * (N - w - 2)), y = inside ? a + Math.floor(r() * (b - a - w + 2)) : 1 + Math.floor(r() * (N - w - 2));
      if (!inside && x > lo - 3 && x < hi + 2 && y > lo - 3 && y < hi + 2) continue;
      if (add(type, x, y, lv())) break;
    }
  };
  place('cannon', Math.min(5, 1 + Math.floor(diff / 2))); place('tower', Math.min(4, Math.floor(diff / 3)));
  place('store', diff >= 4 ? 1 : 0); place('barracks', diff >= 6 ? 1 : 0);
  place('house', 1 + Math.floor(r() * 2)); place('farm', 1 + Math.floor(r() * 2));
  place('house', Math.floor(r() * 2), false); place('farm', 1, false);
  return { blds, th, loot: { gold: 120 + diff * 110, food: 80 + diff * 80 } };
}
// the bots' army when they raid you (bigger as your Town Hall grows)
function botRaid(seed, th) {
  const r = rng(seed), cap = 6 + 6 * th, list = []; let left = cap;
  for (let i = 0; i < Math.floor(cap / 18); i++) { list.push('brute'); left -= 5; }
  const na = Math.floor(left * 0.4); for (let i = 0; i < na; i++) list.push('archer'); left -= na;
  for (let i = 0; i < left; i++) list.push('warrior');
  const side = Math.floor(r() * 4), r2 = v => Math.round(v * 100) / 100;
  return list.map(t => { const p = 2 + r() * (N - 4); const [x, y] = side === 0 ? [p, 0.6] : side === 1 ? [N - 0.6, p] : side === 2 ? [p, N - 0.6] : [0.6, p]; return { t, x: r2(x), y: r2(y) }; });
}

/* ---------- the battle ---------- */
const DT = 0.1, MAX_TICKS = 1500; // 0.1 s per tick, 2½ minutes at most
function battle(blds, deploys) {
  const B = blds.map((b, i) => { const k = BLD[b.type], hp = hpOf(b); return { i, id: b.id, type: b.type, x: b.x, y: b.y, w: k.w, h: k.h, lvl: b.lvl, hp, max: hp, cd: 0, aim: -Math.PI / 2, dead: false, def: k.def || null, cx: b.x + k.w / 2, cy: b.y + k.h / 2 }; });
  const occ = new Int16Array(N * N).fill(-1);
  B.forEach(b => { for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) occ[y * N + x] = b.i; });
  return { B, occ, T: [], queue: deploys.slice(0, 250), t: 0, shots: [], over: false };
}
function hitB(s, b, dmg) { b.hp -= dmg; if (b.hp <= 0) { b.hp = 0; b.dead = true; for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) if (s.occ[y * N + x] === b.i) s.occ[y * N + x] = -1; } }
function pickTarget(s, u) {
  const k = TROOP[u.type], defsLeft = k.prefers === 'def' && s.B.some(b => !b.dead && b.def);
  let best = -1, bd = 1e9;
  for (const b of s.B) { if (b.dead || b.type === 'wall' || (defsLeft && !b.def)) continue; const d = rd(u.x, u.y, b.x, b.y, b.w, b.h); if (d < bd - 1e-9) { bd = d; best = b.i; } }
  return best;
}
function troopTick(s, u) {
  const k = TROOP[u.type];
  u.cd = Math.max(0, u.cd - DT);
  if (u.tgt < 0 || s.B[u.tgt].dead) u.tgt = pickTarget(s, u);
  if (u.tgt < 0) return;
  const b = s.B[u.tgt], d = rd(u.x, u.y, b.x, b.y, b.w, b.h);
  const px = Math.max(b.x, Math.min(u.x, b.x + b.w)), py = Math.max(b.y, Math.min(u.y, b.y + b.h));
  if (d <= k.range) {
    u.face = Math.atan2(py - u.y, px - u.x);
    if (u.cd <= 0) { hitB(s, b, k.dmg); u.cd = k.rate; s.shots.push({ k: u.type, x1: u.x, y1: u.y, x2: px, y2: py }); }
    return;
  }
  const dx = px - u.x, dy = py - u.y, L = Math.hypot(dx, dy) || 1, st = k.speed * DT;
  const nx = u.x + dx / L * st, ny = u.y + dy / L * st; u.face = Math.atan2(dy, dx);
  const tx = Math.floor(nx), ty = Math.floor(ny); // something in the way (a wall or another building)? Break it first.
  if (tx >= 0 && ty >= 0 && tx < N && ty < N) { const o = s.occ[ty * N + tx]; if (o >= 0 && o !== b.i && !s.B[o].dead) { u.tgt = o; return; } }
  u.x = nx; u.y = ny;
}
function defTick(s, b) {
  b.cd = Math.max(0, b.cd - DT);
  let best = null, bd = 1e9;
  for (const u of s.T) { if (u.dead) continue; const d = Math.hypot(u.x - b.cx, u.y - b.cy); if (d <= b.def.range && d < bd) { bd = d; best = u; } }
  if (!best) return;
  b.aim = Math.atan2(best.y - b.cy, best.x - b.cx);
  if (b.cd > 0) return;
  best.hp -= dmgOf(b.type, b.lvl); b.cd = b.def.rate; s.shots.push({ k: b.type, x1: b.cx, y1: b.cy, x2: best.x, y2: best.y });
  if (best.hp <= 0) { best.hp = 0; best.dead = true; }
}
// one tick (0.1 s). Returns false once the battle is over.
function step(s) {
  if (s.over) return false;
  s.shots = [];
  if (s.queue.length && s.t % 2 === 0) { const d = s.queue.shift(), k = TROOP[d.t]; if (k) s.T.push({ id: s.T.length, type: d.t, x: d.x, y: d.y, hp: k.hp, max: k.hp, cd: 0, tgt: -1, dead: false, face: 0 }); }
  for (const u of s.T) if (!u.dead) troopTick(s, u);
  for (const b of s.B) if (!b.dead && b.def) defTick(s, b);
  s.t++;
  if ((!s.queue.length && !s.T.some(u => !u.dead)) || !s.B.some(b => !b.dead && b.type !== 'wall') || s.t >= MAX_TICKS) s.over = true;
  return !s.over;
}
function result(s) {
  const nw = s.B.filter(b => b.type !== 'wall'), dead = nw.filter(b => b.dead).length;
  const pct = nw.length ? Math.floor(dead * 100 / nw.length) : 0, hallDown = s.B.some(b => b.type === 'hall' && b.dead);
  return { pct, hallDown, stars: (pct >= 50 ? 1 : 0) + (hallDown ? 1 : 0) + (pct === 100 ? 1 : 0), ticks: s.t };
}
function runBattle(blds, deploys) { const s = battle(blds, deploys); while (step(s)); return result(s); }

/* 🏰 Study Base page (admin test version). Draws your base on a canvas, lets you drag buildings around,
   and plays battles. The server checks every action and decides every battle; this page shows what happened.
   The rules and the battle simulation above this code come from src/base/rules.js. */
(() => {
  const $ = s => document.querySelector(s);
  const cv = $('#cv'); let ctx = cv.getContext('2d');
  let S = null, tab = 'base', mode = 'home', sel = null, drag = null, place = null, scout = null, fight = null, toastT = null, busy = false;
  let T = 28, SIZE = 616, DPR = 1;
  const TCOL = { warrior: '#3b82f6', archer: '#22c55e', brute: '#a855f7' }, TLIGHT = { warrior: '#93c5fd', archer: '#86efac', brute: '#d8b4fe' };
  const ECOL = { warrior: '#ef4444', archer: '#f97316', brute: '#be123c' }, ELIGHT = { warrior: '#fca5a5', archer: '#fdba74', brute: '#fda4af' };
  const fmt = n => Math.floor(n).toLocaleString('en-AU');
  const dur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.ceil(s % 3600 / 60); return h ? h + ' h ' + (m === 60 ? 59 : m) + ' min' : Math.max(1, m) + ' min'; };
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const btn = (label, cls, fn, dis) => { const b = el('button', 'btn ' + (cls || ''), label); b.type = 'button'; b.onclick = fn; if (dis) { b.disabled = true; if (typeof dis === 'string') b.title = dis; } return b; };
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3800); }

  async function api(path, body) {
    if (busy && body) return null; busy = !!body;

  /* ================= start ================= */
  (async () => {
    const j = await api(''); if (!j) return;
    resize(); render();
    setInterval(async () => { if (document.visibilityState === 'visible' && mode === 'home' && !drag && !busy) { if (await api('')) render(); } }, 60000);
  })();
})();

</script>
