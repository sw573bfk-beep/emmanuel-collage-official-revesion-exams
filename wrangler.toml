# EC Revisions on Cloudflare: one Worker serves the site (public/) and its API (src/worker.js),
# and a D1 database stores accounts, saved progress and usage (who studied, when, for how long).
name = "ec-revisions"
main = "src/worker.js"
compatibility_date = "2025-09-01"
# Live at https://ec-revisions.sw573bfk.workers.dev
workers_dev = true
preview_urls = false

[vars]
# This account can open the admin dashboard at /admin/. Case doesn't matter when logging in.
ADMIN_USERNAME = "Beau"
# Used by the admin "Limits & usage" section to ask Cloudflare how much of the daily limits are used.
# (It also needs a secret CF_API_TOKEN with "Account Analytics: Read", added in the Cloudflare dashboard.)
CF_ACCOUNT_ID = "8859192e3ec70410341f57569d7da75f"
D1_DATABASE_ID = "b7b26faf-65cf-4d7b-98ad-da731ff695c3"

# The pages in public/ are bundled into the Worker itself (see the imports at the top of src/worker.js),
# so a deploy is a single upload.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/public/**/*.js", "**/public/*.js"]
fallthrough = false

# Created with:  npx wrangler d1 create ec-revisions-db --location oc (Oceania, close to Queensland)

[[d1_databases]]
binding = "DB"
database_name = "ec-revisions-db"
database_id = "b7b26faf-65cf-4d7b-98ad-da731ff695c3"
migrations_dir = "migrations"
